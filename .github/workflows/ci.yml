name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test（三层：unit / integration / scenarios）
        run: pnpm test

      - name: Lab（九幕端到端冒烟）
        run: pnpm lab

      - name: Scenarios（12 场景评估报告）
        run: pnpm scenarios
